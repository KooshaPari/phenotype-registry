# Org-wide cargo-deny baseline.
# Consumed by sibling repos via the reusable-cargo-deny.yml workflow, or copied
# as a starting point. Conservative defaults — tighten per repo, don't loosen here.

[advisories]
# Fail on known vulnerabilities and unmaintained crates.
version = 2
yanked = "deny"
# Per [latest-pkgs / CVE-aware] org policy: stay on latest stable, drop to the
# highest patched version on an active CVE and cite the advisory ID in an ignore.
ignore = []

[bans]
# Surface duplicate versions and wildcard deps without hard-failing the org baseline.
multiple-versions = "warn"
wildcards = "warn"
allow = []
deny = []

[licenses]
version = 2
# SPDX allowlist — permissive licenses only. Add to this list deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[sources]
# Only crates.io and first-party git sources by default.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/KooshaPari"]
