# Drop-in replacement for the stale workflows/conventions.yml which calls a
# reusable workflow from the now-archived/deleted `phenotype-org-governance`
# at a pinned SHA. This version inlines the lint logic so it doesn't depend
# on the dead reusable.
name: naming-conventions
on:
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'catalog/registry.yaml'
      - 'registry/disposition-index.json'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: enforce pheno-* naming conventions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/workflows/naming-conventions.sh
