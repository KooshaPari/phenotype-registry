name: Publish Python SDK to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, no publish)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build wheels and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-maturin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-maturin-

      - name: Build wheels and sdist
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist -m crates/pheno-registry-python/Cargo.toml
          sccache: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run || inputs.dry_run == 'false' }}
    environment:
      name: pypi
      url: https://pypi.org/p/phenotype-registry
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Uses trusted publishing (OIDC) — no API token needed.
          # Configure at: https://pypi.org/manage/project/phenotype-registry/settings/publishing/
