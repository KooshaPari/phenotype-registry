# Reusable cargo-deny policy workflow.
# Sibling repos enforce the org supply-chain baseline by calling this:
#
#   jobs:
#     deny:
#       uses: KooshaPari/phenotype-org-governance/.github/workflows/reusable-cargo-deny.yml@main
#
# Mirrors the checks in scripts/cargo-deny-org-weekly.sh (advisories, bans,
# licenses, sources) but as a callable CI surface rather than a local sweep.
name: cargo-deny (reusable)

on:
  workflow_call:
    inputs:
      manifest-path:
        description: Path to Cargo.toml to check.
        type: string
        required: false
        default: Cargo.toml
      checks:
        description: Space-separated cargo-deny checks to run.
        type: string
        required: false
        default: advisories bans licenses sources
      deny-config:
        description: Path to deny.toml. Defaults to the caller's repo root.
        type: string
        required: false
        default: deny.toml

permissions:
  contents: read

concurrency:
  group: cargo-deny-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ inputs.manifest-path }}
          command: check ${{ inputs.checks }}
          arguments: ${{ inputs.deny-config != '' && format('--config {0}', inputs.deny-config) || '' }}
