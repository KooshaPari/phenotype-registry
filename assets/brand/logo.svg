<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="phenotype-org-governance">
  <title>phenotype-org-governance</title>
  <desc>AI-coded vector mark: an org-chart hierarchy crowned by a gavel, for org governance. Hand-authored paths.</desc>
  <defs>
    <linearGradient id="og-bg" x1="24" y1="24" x2="488" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1428"/>
      <stop offset="1" stop-color="#152544"/>
    </linearGradient>
    <linearGradient id="og-node" x1="160" y1="240" x2="352" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#og-bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="#26406E" stroke-width="2"/>

  <!-- Connectors -->
  <g stroke="#3B6FBF" stroke-width="7">
    <path d="M 256 232 L 256 300"/>
    <path d="M 158 360 L 158 322 L 354 322 L 354 360"/>
    <path d="M 256 300 L 256 322"/>
  </g>

  <!-- Gavel at the top (governance authority) -->
  <g>
    <rect x="206" y="150" width="100" height="46" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="4" transform="rotate(-30 256 173)"/>
    <rect x="248" y="186" width="16" height="70" rx="8" fill="#CBD5E1" transform="rotate(-30 256 220)"/>
  </g>

  <!-- Org-chart nodes -->
  <g fill="url(#og-node)" stroke="#BFDBFE" stroke-width="4">
    <rect x="216" y="300" width="80" height="46" rx="12"/>
    <rect x="118" y="360" width="80" height="46" rx="12"/>
    <rect x="314" y="360" width="80" height="46" rx="12"/>
  </g>
</svg>
