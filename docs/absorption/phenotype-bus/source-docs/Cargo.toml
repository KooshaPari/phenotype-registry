[workspace]
[workspace.package]

rust-version = "1.75"

[package]
name = "phenotype-bus"
version = "0.1.0"
edition = "2021"
authors = ["Koosha Pari <kooshapari@gmail.com>"]
license = "Apache-2.0"
description = "Generic pub/sub event bus for cross-collection communication in Phenotype"
repository = "https://github.com/KooshaPari/phenotype-bus"

[dependencies]
tokio = { version = "1.39", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.39", features = ["full"] }

[lib]
name = "phenotype_bus"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
