[package]
name = "agileplus-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/Pyron"
description = "agileplus github — Phenotype infrastructure crate (Pyron)"
documentation = "https://docs.rs/agileplus-github"
keywords = ["phenotype", "pyron", "git"]
categories = ["development-tools::version-control"]
authors = ["kooshapari"]

[dependencies]
agileplus-domain = { path = "../agileplus-domain" }
agileplus-triage = { path = "../agileplus-triage" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
anyhow.workspace = true
sha2.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
wiremock = "0.6"
