[package]
name = "agileplus-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/Pyron"
description = "agileplus git — Phenotype infrastructure crate (Pyron)"
documentation = "https://docs.rs/agileplus-git"
keywords = ["phenotype", "pyron", "git"]
categories = ["development-tools::version-control"]
authors = ["kooshapari"]

[dependencies]
agileplus-domain = { path = "../agileplus-domain" }
git2 = { version = "0.20", features = ["vendored-libgit2"] }
gix = { version = "0.71", default-features = false, features = ["worktree-stream", "revision"] }
notify = "8"
async-nats = "0.46"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tracing = "0.1"
toml = "0.8"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
